{% set name = "qcengine" %}
{% set version = "0.51.0" %}
{% set sha256 = "23a122d132329585a8add8cd023d305c0c4c1f5032bf8a7ab22273e05d7c4c0d" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps -vvv

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - setuptools-scm
  run:
    - python >={{ python_min }}
    - packaging
    - pydantic >=2.11,<3
    - pydantic-settings
    - pyyaml
    - py-cpuinfo
    - psutil
    - qcelemental >=0.50.4,<0.70.0

test:
  imports:
    - qcengine
  requires:
    - pytest
    - msgpack-python
    - pip
    - python {{ python_min }}
    # constraints are to avoid conflict of psi4 demanding qcmb <=0.5
    - psi4
    - qcmanybody >=0.7.1
  commands:
    - test -f $SP_DIR/qcengine/__init__.py
    - pip check
    - python -c "import qcengine as qc;assert qc.__version__ == '{{ version }}', f'{qc.__version__=} differs from recipe=\'{{ version }}\''"
    - python -c "import importlib.metadata as md;assert md.version('{{ name }}') == '{{ version }}', f'''{md.version('{{ name }}')=} differs from recipe=\'{{ version }}\''''"
    - pytest --pyargs qcengine    

about:
  home: http://github.com/MolSSI/QCEngine
  doc_url: https://molssi.github.io/QCEngine/
  dev_url: http://github.com/MolSSI/QCEngine
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A wrapper for Quantum Chemistry engines that adheres to the MolSSI (molssi.org) QCSchema.

extra:
  recipe-maintainers:
    - dgasmith
    - lnaden
    - bennybp
    - loriab
